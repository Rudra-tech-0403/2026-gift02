<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Happy Birthday ♥ — a little film</title>
  <meta name="description" content="A cinematic birthday film in four acts: a beating heart you open with a tap, a rush of colour, a kinetic wish, and a tree that blooms into a heart of petals." />
  <meta name="theme-color" content="#f7e7dc" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;0,700&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&display=swap" rel="stylesheet" />

  <!-- Load GSAP from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <script>document.documentElement.classList.add('js')</script>
  
  <style>
    :root{
      /* --- warm paper (Act 1 + the tree's dawn) --- */
      --paper-0:  #fff6ee;
      --paper-1:  #f9e2d2;
      --paper-2:  #f2c9b8;

      /* --- rose flood (Acts 2–3) --- */
      --rose-deep: #a80f43;
      --rose:      #d4235c;
      --rose-lift: #ff5f86;
      --wine:      #6e0a31;

      /* --- accents / ink --- */
      --gold-1:    #ffcf6a;
      --gold-2:    #e8a23d;
      --gold-3:    #f6d896;
      --ink:       #7a4a55;
      --ink-soft:  #a9808a;
      --cream:     #fff3ea;

      /* --- the kept room (Acts 5–6): warm noir --- */
      --noir-0:    #2c1019;
      --noir-1:    #190810;
      --noir-2:    #0b0409;

      --ease-out:  cubic-bezier(.2,.7,.2,1);
      --ease-luxe: cubic-bezier(.16,.8,.24,1);
    }

    *{ box-sizing:border-box; margin:0; padding:0; }
    html, body{ height:100%; }

    body{
      background:#12060c;
      overflow:hidden;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
      cursor:auto;
      touch-action:manipulation;
      overscroll-behavior:none;
    }

    .scene{ position:fixed; inset:0; overflow:hidden; }

    .sr-only{
      position:absolute; width:1px; height:1px; padding:0; margin:-1px;
      overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
    }

    .tree{
      position:absolute; inset:0;
      width:100%; height:100%;
      display:block;
      z-index:1;
    }

    .hero{
      position:absolute; inset:0;
      z-index:3;
      overflow:hidden;
    }
    .hero__bg{
      position:absolute; inset:0;
      background: radial-gradient(120% 88% at 50% 24%, #fff8f1 0%, var(--paper-0) 38%, var(--paper-1) 74%, var(--paper-2) 100%);
    }
    .hero__bg::after{
      content:""; position:absolute; left:50%; top:44%;
      width:min(78vw,720px); aspect-ratio:1; transform:translate(-50%,-50%);
      background:radial-gradient(circle, rgba(255,190,150,.55), rgba(255,150,170,.16) 46%, transparent 70%);
      filter:blur(6px);
    }

    .hero__motes{ position:absolute; inset:0; pointer-events:none; }
    .mote{
      position:absolute; border-radius:50%;
      background:radial-gradient(circle, rgba(255,236,214,.9), rgba(255,206,180,.15) 55%, transparent 72%);
      will-change:transform, opacity;
    }

    .hero__eyebrow{
      position:absolute; top:13%; left:0; right:0;
      text-align:center;
      font-family:"Cormorant Garamond", Georgia, serif;
      font-style:italic; font-weight:600;
      font-size:clamp(15px, 3.6vw, 26px);
      letter-spacing:.06em;
      color:#a85069;
      text-shadow:0 1px 10px rgba(255,248,241,.9);
      opacity:0;
    }

    .targetWrap{
      position:absolute; top:33%; left:0; right:0;
      display:flex; justify-content:center;
      transform:translateY(-50%);
      pointer-events:none;
    }
    .target{
      position:relative;
      width:clamp(120px, 27vw, 208px);
      aspect-ratio:100/92;
      will-change:transform;
      transform-origin:50% 60%;
    }
    .target__heart{ position:absolute; inset:0; display:block; }

    .heart__glow{
      position:absolute; left:50%; top:52%;
      width:230%; aspect-ratio:1; transform:translate(-50%,-50%) scale(1);
      border-radius:50%;
      background:radial-gradient(circle, rgba(255,120,150,.55), rgba(255,90,130,.18) 42%, transparent 68%);
      filter:blur(4px);
      pointer-events:none;
      will-change:transform, opacity;
    }
    .heart__svg{
      width:100%; height:100%; display:block;
      transform-origin:50% 60%;
      filter: drop-shadow(0 10px 22px rgba(168,15,64,.34)) drop-shadow(0 3px 6px rgba(120,10,48,.30));
      will-change:transform;
    }

    .archery{
      position:absolute; top:0; left:0;
      width:clamp(100px, 18vw, 168px);
      cursor:grab;
      -webkit-tap-highlight-color:transparent;
      touch-action:none;
      will-change:transform;
    }
    .archery:active{ cursor:grabbing; }
    .archery:focus-visible{ outline:none; }
    .archery:focus-visible .bow{ filter:drop-shadow(0 0 0 3px rgba(255,255,255,.85)) drop-shadow(0 10px 18px rgba(120,50,20,.4)); }
    .bow{
      display:block; width:100%; height:auto;
      filter:drop-shadow(0 12px 18px rgba(90,40,15,.3));
      overflow:visible;
    }

    .aim{
      position:absolute; left:50%; bottom:32%;
      width:2px; height:190%; margin-left:-1px;
      transform-origin:bottom center;
      background:linear-gradient(0deg, rgba(255,214,150,.6) 0%, rgba(255,150,170,.22) 52%, transparent 78%);
      opacity:0; pointer-events:none;
    }

    .arrow{
      position:absolute; left:0; right:0; margin-inline:auto;
      bottom:36%;
      width:17.5%; height:auto;
      overflow:visible;
      will-change:transform;
      filter:drop-shadow(0 5px 7px rgba(90,40,15,.36));
    }
    .arrow__wings{ transform-box:fill-box; transform-origin:50% 90%; }
    .arrow__wings .wingL, .arrow__wings .wingR{ transform-box:fill-box; }
    .wingL{ transform-origin:88% 60%; animation:flapL 2.6s ease-in-out infinite; }
    .wingR{ transform-origin:12% 60%; animation:flapR 2.6s ease-in-out infinite; }
    @keyframes flapL{ 0%,100%{ transform:rotate(0deg); } 50%{ transform:rotate(-11deg); } }
    @keyframes flapR{ 0%,100%{ transform:rotate(0deg); } 50%{ transform:rotate(11deg); } }

    .hero__hint{
      position:absolute; bottom:8.5%; left:0; right:0;
      text-align:center;
      font-family:"Cormorant Garamond", Georgia, serif;
      font-weight:600; font-style:italic;
      font-size:clamp(13px, 3.1vw, 19px);
      letter-spacing:.16em; text-transform:uppercase;
      color:#b06a7c;
      opacity:0;
    }
    .hero__ring{ display:none; }

    .flood{
      position:absolute; left:50%; top:50%;
      width:140px; height:140px; margin:-70px 0 0 -70px;
      border-radius:50%;
      background:radial-gradient(circle at 40% 34%, var(--rose-lift), var(--rose) 46%, var(--rose-deep) 100%);
      z-index:5;
      opacity:0; transform:scale(.001);
      will-change:transform, opacity;
      pointer-events:none;
    }

    .field{
      position:absolute; inset:0;
      z-index:4;
      opacity:0;
      pointer-events:none;
      overflow:hidden;
      background: radial-gradient(120% 100% at 50% 8%, #d5265f 0%, var(--rose) 42%, var(--rose-deep) 78%, var(--wine) 100%);
      color:#fff;
    }
    .blob{
      position:absolute; border-radius:50%;
      filter:blur(46px); opacity:0;
      mix-blend-mode:screen;
      will-change:transform, opacity;
    }
    .blob--1{ width:58vmax; height:58vmax; left:-18vmax; top:-16vmax; background:radial-gradient(circle, rgba(255,130,160,.9), transparent 62%); }
    .blob--2{ width:46vmax; height:46vmax; right:-14vmax; top:22vmax; background:radial-gradient(circle, rgba(255,90,120,.75), transparent 64%); }
    .blob--3{ width:52vmax; height:52vmax; left:24vmax; bottom:-22vmax; background:radial-gradient(circle, rgba(180,20,70,.8), transparent 66%); }

    .fgrid{
      position:absolute; inset:-6%;
      background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
      background-size:clamp(38px,7vw,74px) clamp(38px,7vw,74px);
      will-change:transform;
    }
    .fvignette{
      position:absolute; inset:0;
      background:radial-gradient(128% 96% at 50% 44%, transparent 50%, rgba(70,6,28,.5) 100%);
    }

    .camera{
      position:absolute; inset:0;
      display:flex; flex-direction:column; justify-content:center; align-items:center;
      gap:clamp(4px,1.2vh,12px);
      padding:0 6vw; text-align:center;
      will-change:transform;
    }
    .kEyebrow{
      font-family:"Cormorant Garamond", Georgia, serif;
      font-style:italic; font-weight:500;
      font-size:clamp(15px, 3.6vw, 27px);
      letter-spacing:.08em;
      color:#ffd7c8;
      opacity:0; transform:translateY(10px);
      margin-bottom:clamp(2px,1vh,10px);
    }

    .headline{ font-family:"Fraunces", Georgia, serif; line-height:.92; }
    .hl__line{ display:block; }
    .mask{ display:inline-block; overflow:hidden; padding:.14em .06em; margin:-.14em -.06em; }
    .hl__word{
      display:inline-block; font-weight:900; font-size:clamp(52px, 15vw, 168px);
      letter-spacing:-.02em; color:#fff6f1;
      text-shadow:0 6px 34px rgba(60,4,24,.34), 0 2px 3px rgba(90,8,36,.42);
    }
    .hl__ch{ display:inline-block; will-change:transform; }

    .uline{
      width:clamp(150px, 40vw, 380px); height:auto;
      margin-top:clamp(4px,1.4vh,14px);
      color:var(--gold-1); filter:drop-shadow(0 2px 8px rgba(255,180,90,.5));
    }
    .kSub{
      margin-top:clamp(12px,2.4vh,26px);
      font-family:"Cormorant Garamond", Georgia, serif;
      font-weight:500; font-style:italic; font-size:clamp(14px, 3.4vw, 24px);
      letter-spacing:.05em; color:#ffdfd2;
      opacity:0; transform:translateY(10px);
    }

    .bar{ position:absolute; left:0; right:0; height:16vh; height:16dvh; background:#12040b; z-index:3; will-change:transform; pointer-events:none; }
    .bar--top{ top:0; }
    .bar--bot{ bottom:0; }

    .bloom{
      position:absolute; left:50%; top:50%;
      width:60px; height:60px; margin:-30px 0 0 -30px;
      border-radius:50%;
      background:radial-gradient(circle, #fff 0%, #fff2d6 30%, rgba(255,214,150,.85) 55%, rgba(255,190,150,0) 74%);
      z-index:8; opacity:0; transform:scale(.001);
      will-change:transform, opacity; pointer-events:none;
    }

    .wish{
      position:absolute; left:5.5%; bottom:10%; max-width:46%; z-index:6; pointer-events:none; color:var(--ink); visibility:hidden;
    }
    .wish.is-in{ visibility:visible; }
    .wish::before{
      content:""; position:absolute; inset:-18% -24% -24% -16%;
      background:radial-gradient(84% 98% at 34% 52%, rgba(255,250,243,.94), rgba(255,250,243,.6) 48%, rgba(255,250,243,0) 80%);
      z-index:-1; opacity:0; transition:opacity 1s ease;
    }
    .wish.is-in::before{ opacity:1; }
    .wish__eyebrow{
      font-family:"Cormorant Garamond", Georgia, serif; font-style:italic; font-weight:600;
      font-size:clamp(13px, 3.2vw, 24px); letter-spacing:.05em; color:#9c4f63;
      text-shadow:0 1px 2px #fff8f1, 0 0 8px rgba(255,248,241,.95);
    }
    .wish__heroWrap{ position:relative; display:inline-block; }
    .wish__heroWrap::before{
      content:""; position:absolute; left:-12%; right:-12%; top:-26%; bottom:-22%;
      background:radial-gradient(60% 70% at 46% 52%, rgba(255,214,168,.5), rgba(255,150,150,.2) 52%, transparent 74%);
      filter:blur(14px); z-index:-1; opacity:0; pointer-events:none;
    }
    .wish__heroWrap::after{
      content:"\2726"; position:absolute; right:-1%; top:-14%; font-size:clamp(15px, 3.6vw, 32px);
      color:#ffe1a0; text-shadow:0 0 12px rgba(255,205,120,.95); opacity:0; pointer-events:none;
    }
    .wish__hero{
      font-family:"Great Vibes", cursive; font-weight:400; font-size:clamp(40px, 9.6vw, 86px);
      line-height:.98; margin:-.02em 0 .06em;
      background:linear-gradient(180deg, #e85a83 0%, #c41f52 50%, #9c0f42 100%);
      -webkit-background-clip:text; background-clip:text; color:transparent;
      filter: drop-shadow(0 1px 1px rgba(255,252,248,.98)) drop-shadow(0 2px 6px rgba(130,18,55,.45));
      clip-path:inset(0 100% -28% -10%); transform-origin:8% 60%;
    }
    .wish__rule{
      display:block; width:clamp(46px, 13vw, 110px); height:2px; margin:.12em 0 .48em;
      background:linear-gradient(90deg, var(--gold-2), rgba(232,162,61,0));
      box-shadow:0 0 8px rgba(255,247,240,.9); transform-origin:left center;
    }
    .wish__sub{
      font-family:"Cormorant Garamond", Georgia, serif; font-weight:600; font-size:clamp(12px, 2.9vw, 20px);
      letter-spacing:.03em; color:#6e3f4a; text-shadow:0 1px 2px #fff8f1, 0 0 8px rgba(255,248,241,.98);
    }
    .wish__eyebrow, .wish__rule, .wish__sub{
      opacity:0; transform:translateY(12px); filter:blur(5px);
      transition:opacity .8s ease, transform .9s var(--ease-out), filter .8s ease;
    }
    .wish__rule{ transform:translateY(12px) scaleX(.3); }
    .wish.is-in .wish__eyebrow, .wish.is-in .wish__sub{ opacity:1; transform:translateY(0); filter:blur(0); }
    .wish.is-in .wish__rule{ opacity:1; transform:translateY(0) scaleX(1); transition-delay:1.35s; }
    .wish.is-in .wish__sub{  transition-delay:1.55s; }
    .wish.is-in .wish__hero{
      animation:write 1.2s cubic-bezier(.62,.04,.24,1) .35s forwards, wishBreath 4s ease-in-out 1.9s infinite;
    }
    @keyframes wishBreath{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.02); } }
    .wish.is-in .wish__heroWrap::before{ animation:hlin .8s ease .3s forwards, hlpulse 3.4s ease-in-out 1.7s infinite; }
    .wish.is-in .wish__heroWrap::after{ animation:twk 2.6s ease-in-out 1.6s infinite; }
    @keyframes write{ from{ clip-path:inset(0 100% -28% -10%); } to{ clip-path:inset(0 -10% -28% -10%); } }
    @keyframes hlin{ from{ opacity:0; transform:scale(.86); } to{ opacity:.92; transform:scale(1); } }
    @keyframes hlpulse{ 0%,100%{ opacity:.72; } 50%{ opacity:1; } }
    @keyframes twk{ 0%,100%{ opacity:0; transform:scale(.5) rotate(-12deg); } 45%{ opacity:1; transform:scale(1.05) rotate(16deg); } }

    .replay{
      position:absolute; right:20px; bottom:18px; z-index:7; display:inline-flex; align-items:center; gap:7px;
      padding:9px 15px 9px 12px; border-radius:999px;
      font:600 12.5px/1 "Cormorant Garamond", Georgia, serif; letter-spacing:.12em; text-transform:uppercase;
      color:#8a4a5a; background:rgba(255,248,242,.72); border:1px solid rgba(150,60,80,.18);
      box-shadow:0 6px 20px -8px rgba(120,20,50,.4); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
      cursor:pointer; opacity:0; transform:translateY(8px);
      transition:opacity .5s ease, transform .5s var(--ease-out), background .3s ease;
    }
    .replay.is-shown{ opacity:1; transform:translateY(0); }
    .replay:hover{ background:rgba(255,252,248,.92); }
    .replay svg{ opacity:.8; }

    .continue {
      position: absolute; left: 50%; bottom: 12%; z-index: 7; transform: translate(-50%, 15px);
      display: flex; flex-direction: row; align-items: center; justify-content: center;
      padding: 12px 36px; border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2), inset 0 0 10px rgba(255,255,255,0.1);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      cursor: pointer; opacity: 0; 
      transition: opacity .7s ease, transform .7s var(--ease-out), background 0.3s, border-color 0.3s, box-shadow 0.3s;
    }
    .continue.is-shown { opacity: 1; transform: translate(-50%, 0); }
    .continue:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.6);
      transform: translate(-50%, -3px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.3), inset 0 0 12px rgba(255,255,255,0.2);
    }
    .continue:active { transform: translate(-50%, 0); }
    
    .continue__label {
      font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-weight: 700;
      font-size: clamp(16px, 4vw, 22px); letter-spacing: .12em; text-transform: uppercase;
      color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .grade{ position:absolute; inset:0; z-index:9; pointer-events:none; }
    .grade__vignette{
      position:absolute; inset:0;
      background:radial-gradient(125% 95% at 50% 42%, transparent 54%, rgba(60,18,30,.14) 84%, rgba(40,12,22,.3) 100%);
      mix-blend-mode:multiply;
    }
    .grade__grain{
      position:absolute; inset:0;
      /* Using an inline SVG noise for standard grain effect */
      background:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E") repeat;
      background-size:150px; opacity:.06; mix-blend-mode:overlay;
    }

    .roomClose{
      position:absolute; top:max(18px, env(safe-area-inset-top)); right:max(18px, env(safe-area-inset-right));
      z-index:5; width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
      color:#fbe9d8; background:rgba(255,255,255,.08); border:1px solid rgba(255,223,180,.28);
      backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); cursor:pointer; 
      transition:background .25s ease, transform .25s var(--ease-out), border-color .25s ease;
    }
    .roomClose:hover{ background:rgba(255,255,255,.16); border-color:rgba(255,223,180,.5); transform:scale(1.06); }
    .roomClose:active{ transform:scale(.94); }

    .music-toggle {
      position: fixed; 
      top: max(18px, env(safe-area-inset-top)); 
      left: max(18px, env(safe-area-inset-left));
      z-index: 999; 
      width: 44px; height: 44px; border-radius: 50%; 
      display: flex; align-items: center; justify-content: center;
      background: rgba(255, 255, 255, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15), inset 0 0 10px rgba(255,255,255,0.3);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); 
      color: #111; 
      cursor: pointer; 
      transition: background 0.3s ease, transform 0.25s var(--ease-out), border-color 0.3s ease, opacity 0.3s ease;
    }
    .music-toggle:hover { background: rgba(255,255,255,0.6); transform: scale(1.08); }
    .music-toggle:active { transform: scale(0.92); }
    .music-toggle svg { width: 22px; height: 22px; fill: currentColor; }

    .gallery{
      position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:max(28px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(22px, env(safe-area-inset-bottom));
      background: radial-gradient(120% 90% at 50% 8%, rgba(255,196,140,.14), transparent 58%), radial-gradient(140% 120% at 50% 100%, var(--noir-0) 0%, var(--noir-1) 52%, var(--noir-2) 100%);
      opacity:0; visibility:hidden; pointer-events:none;
      transition:opacity .7s var(--ease-luxe), visibility 0s linear .7s;
    }
    .gallery.is-open{ opacity:1; visibility:visible; pointer-events:auto; transition:opacity .7s var(--ease-luxe), visibility 0s linear 0s; }
    
    .gallery__vignette{
      position:absolute; inset:0; pointer-events:none; background:radial-gradient(120% 90% at 50% 42%, transparent 46%, rgba(0,0,0,.42) 100%);
    }
    .gallery__grain{
      position:absolute; inset:0; pointer-events:none;
      background:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E") repeat;
      background-size:150px; opacity:.05; mix-blend-mode:overlay;
    }

    .gallery__eyebrow{
      position:relative; margin-bottom:clamp(14px,3vh,26px); font-family:"Cormorant Garamond", Georgia, serif;
      font-style:italic; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
      font-size:clamp(11px, 2.6vw, 14px); color:var(--gold-3);
      opacity:0; transform:translateY(-6px); transition:opacity .6s ease .15s, transform .6s var(--ease-out) .15s;
    }
    .gallery.is-open .gallery__eyebrow{ opacity:.86; transform:translateY(0); }

    .gallery__stage{
      position:relative; width:min(92vw, 640px); aspect-ratio:4/5; max-height:56vh; max-height:56dvh; border-radius:10px; overflow:hidden;
      box-shadow:0 30px 70px -20px rgba(0,0,0,.65), 0 0 0 1px rgba(255,224,180,.14);
    }
    .slide{ position:absolute; inset:0; opacity:0; transition:opacity 1s var(--ease-luxe); }
    .slide.is-active{ opacity:1; z-index:1; }
    /* Version 3.0 Addition: Adding video support styling seamlessly */
    .slide img, .slide video { width:100%; height:100%; object-fit:cover; display:block; transform:scale(1.08); }
    .slide.is-active img, .slide.is-active video { animation:kenBurns 6.5s var(--ease-luxe) forwards; }
    
    @keyframes kenBurns{
      from{ transform:scale(1.14) translate(var(--kbx0,0), var(--kby0,0)); }
      to  { transform:scale(1.0)  translate(var(--kbx1,0), var(--kby1,0)); }
    }
    .gallery__stage::after{ content:""; position:absolute; inset:0; pointer-events:none; border-radius:10px; border:1px solid rgba(255,224,180,.35); }
    .gallery__stage::before{ content:""; position:absolute; inset:0; z-index:2; pointer-events:none; box-shadow:inset 0 -50px 60px -40px rgba(0,0,0,.55), inset 0 40px 50px -40px rgba(0,0,0,.3); }

    .gallery__arrow{
      position:absolute; top:50%; transform:translateY(-50%); width:42px; height:42px; border-radius:50%; z-index:3;
      display:flex; align-items:center; justify-content:center; color:#f6e6d6; background:rgba(255,255,255,.06);
      border:1px solid rgba(255,224,180,.22); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
      cursor:pointer; opacity:0; transition:opacity .5s ease .2s, background .2s ease, transform .2s var(--ease-out);
    }
    .gallery.is-open .gallery__arrow{ opacity:.85; }
    .gallery__arrow:hover{ opacity:1; background:rgba(255,255,255,.14); }
    .gallery__arrow:active{ transform:translateY(-50%) scale(.92); }
    .gallery__arrow--prev{ left:clamp(6px, 2.4vw, 26px); }
    .gallery__arrow--next{ right:clamp(6px, 2.4vw, 26px); }
    @media (max-width: 560px){ .gallery__arrow{ display:none; } }

    .gallery__foot{ display:flex; flex-direction:column; align-items:center; gap:14px; margin-top:clamp(16px,3vh,26px); text-align:center; }
    .gallery__caption{ min-height:1.4em; font-family:"Cormorant Garamond", Georgia, serif; font-style:italic; font-weight:500; font-size:clamp(15px, 3.4vw, 20px); color:#f7e9dc; text-shadow:0 2px 14px rgba(0,0,0,.4); }
    .gallery__dots{ display:flex; gap:7px; }
    .gallery__dots button{ width:6px; height:6px; border-radius:50%; padding:0; border:0; cursor:pointer; background:rgba(255,224,180,.32); transition:background .3s ease, transform .3s var(--ease-out); }
    .gallery__dots button.is-active{ background:var(--gold-1); transform:scale(1.35); }

    .gallery__cta{
      margin-top:2px; display:inline-flex; align-items:center; gap:8px; padding:11px 22px 11px 18px; border-radius:999px;
      font:600 12px/1 "Cormorant Garamond", Georgia, serif; letter-spacing:.12em; text-transform:uppercase;
      color:var(--noir-1); background:linear-gradient(180deg, var(--gold-3), var(--gold-2));
      border:0; cursor:pointer; box-shadow:0 10px 26px -10px rgba(0,0,0,.55);
      transition:transform .25s var(--ease-out), box-shadow .25s ease, filter .25s ease;
    }
    .gallery__cta:hover{ transform:translateY(-2px); filter:brightness(1.06); }
    .gallery__cta:active{ transform:translateY(0); }

    .cinema{
      position:fixed; inset:0; z-index:50; background:#050203; opacity:0; visibility:hidden; pointer-events:none;
      transition:opacity .6s var(--ease-luxe), visibility 0s linear .6s;
    }
    .cinema.is-open{ opacity:1; visibility:visible; pointer-events:auto; transition:opacity .6s var(--ease-luxe), visibility 0s linear 0s; }
    .cinema__video{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000; }
    .cinema__scrim{ position:absolute; inset:0; pointer-events:none; background:radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0,0,0,.5) 100%); opacity:0; transition:opacity .4s ease; }
    .cinema.is-playing .cinema__scrim{ opacity:.0; }
    .cinema:not(.is-playing) .cinema__scrim{ opacity:1; }

    .cinema__bar{ position:absolute; left:0; right:0; height:9vh; height:9dvh; min-height:26px; background:#050203; z-index:2; pointer-events:none; transform:scaleY(1); transition:transform .6s var(--ease-luxe); }
    .cinema__bar--top{ top:0; transform-origin:top; }
    .cinema__bar--bot{ bottom:0; transform-origin:bottom; }
    .cinema.is-playing .cinema__bar{ transform:scaleY(0); }

    .cinema__play{
      position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:74px; height:74px; border-radius:50%; z-index:3;
      display:flex; align-items:center; justify-content:center; color:var(--noir-1); background:radial-gradient(circle at 34% 30%, #fff6e8, var(--gold-1) 46%, var(--gold-2) 100%);
      border:0; cursor:pointer; box-shadow:0 0 0 1px rgba(255,224,180,.4), 0 18px 40px -12px rgba(0,0,0,.7); transition:opacity .4s ease, transform .3s var(--ease-out);
    }
    .cinema__play svg{ margin-left:3px; }
    .cinema__play:hover{ transform:translate(-50%,-50%) scale(1.06); }
    .cinema.is-playing .cinema__play{ opacity:0; pointer-events:none; transform:translate(-50%,-50%) scale(.8); }

    .cinema__mute{
      position:absolute; left:max(18px, env(safe-area-inset-left)); bottom:max(20px, env(safe-area-inset-bottom));
      z-index:3; width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
      color:#fbe9d8; background:rgba(255,255,255,.08); border:1px solid rgba(255,223,180,.28);
      backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); cursor:pointer; opacity:0; transition:opacity .4s ease, background .25s ease;
    }
    .cinema.is-playing .cinema__mute{ opacity:1; }
    .cinema__mute:hover{ background:rgba(255,255,255,.16); }

    .cinema__label{
      position:absolute; left:0; right:0; bottom:max(24px, env(safe-area-inset-bottom)); text-align:center; z-index:3; pointer-events:none;
      font-family:"Cormorant Garamond", Georgia, serif; font-style:italic; font-weight:500; font-size:clamp(13px, 3vw, 17px); letter-spacing:.05em;
      color:#f3e2d2; text-shadow:0 2px 12px rgba(0,0,0,.5); opacity:1; transition:opacity .4s ease;
    }
    .cinema.is-playing .cinema__label{ opacity:0; }

    @media (prefers-reduced-motion: reduce){
      .hero, .flood, .field, .bloom, .hero__ring{ display:none !important; }
      .wish__eyebrow, .wish__rule, .wish__sub{ opacity:1; transform:none; filter:none; transition:none; }
      .wish__hero{ clip-path:none; filter:drop-shadow(0 0 5px rgba(255,252,248,.98)) drop-shadow(0 2px 4px rgba(130,18,55,.5)) drop-shadow(0 4px 14px rgba(150,28,70,.32)); }
      .wish.is-in .wish__hero{ animation:none; }
      .wish.is-in .wish__heroWrap::before{ animation:none; opacity:.9; }
      .wish.is-in .wish__heroWrap::after{ animation:none; opacity:0; }
      .slide.is-active img, .slide.is-active video{ animation:none; transform:scale(1); }
      .gallery, .cinema{ transition:opacity .3s ease, visibility 0s linear 0s; }
    }
  </style>
</head>
<body>
  <!-- Background Audio Player -->
  <audio id="bgMusic" src="./dataset/music.mp3" loop preload="auto" autoplay></audio>
  
  <button class="music-toggle" id="musicToggle" type="button" aria-label="Toggle music">
    <svg class="ic-play" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
    </svg>
    <svg class="ic-pause" viewBox="0 0 24 24" aria-hidden="true" hidden>
      <path d="M4.27 3L3 4.27l9 9v.28c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4v-1.73l4.26 4.26 1.27-1.27L4.27 3zM10 19c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zM12 4.36L12 3h6v4h-4v3.68l-2-2V4.36z"/>

    <section class="hero" id="hero" aria-label="Draw the bow to open your card">

        <div class="target" id="target">
          <span class="heart__glow" aria-hidden="true"></span>
          <span class="target__heart" id="targetHeart">
            <svg class="heart__svg" viewBox="0 0 100 92" aria-hidden="true">
              <defs>
                <radialGradient id="hg" cx="38%" cy="30%" r="80%">
                  <stop offset="0%"  stop-color="#ffd9e4" />

                  <stop offset="82%" stop-color="#d81e57" />
                  <stop offset="100%" stop-color="#9d0f3e" />
                </radialGradient>
                <linearGradient id="hsheen" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%"  stop-color="rgba(255,255,255,.85)" />
                  <stop offset="34%" stop-color="rgba(255,255,255,0)" />
                </linearGradient>
              </defs>
              <path d="M50 86.5C26 68 10.5 53.6 10.5 34.6 10.5 20.4 21 11 33.2 11c8.6 0 14.2 4.7 16.8 11.4C52.6 15.7 58.2 11 66.8 11 79 11 89.5 20.4 89.5 34.6 89.5 53.6 74 68 50 86.5Z" fill="url(#hg)" />
              <path d="M50 86.5C26 68 10.5 53.6 10.5 34.6 10.5 20.4 21 11 33.2 11c8.6 0 14.2 4.7 16.8 11.4C52.6 15.7 58.2 11 66.8 11 79 11 89.5 20.4 89.5 34.6 89.5 53.6 74 68 50 86.5Z" fill="url(#hsheen)" opacity=".7" />
              <ellipse cx="34" cy="30" rx="8.5" ry="5.4" fill="#fff" opacity=".72" style="mix-blend-mode:screen" />
            </svg>
          </span>
        </div>
      </div>

      <div class="archery" id="archery" role="button" tabindex="0" aria-label="Draw the bow and release to send the arrow to the heart">
          <div class="aim" id="aim" aria-hidden="true"></div>
          <svg class="bow" id="bow" viewBox="0 0 460 300" aria-hidden="true">
            <defs>
              <linearGradient id="limb" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0"   stop-color="#4a2a1a" />
                <stop offset=".18" stop-color="#6b3f24" />
                <stop offset=".5"  stop-color="#8a5127" />
                <stop offset=".82" stop-color="#6b3f24" />
                <stop offset="1"   stop-color="#4a2a1a" />
              </linearGradient>
              <linearGradient id="limbHi" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="rgba(255,214,160,.8)" />
                <stop offset="1" stop-color="rgba(255,214,160,0)" />
              </linearGradient>
              <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#2a1a10" />

                <stop offset="1" stop-color="#2a1a10" />

            </defs>
            <path class="bow__limb" d="M34 96 C 118 168, 168 240, 230 252 C 292 240, 342 168, 426 96" fill="none" stroke="url(#limb)" stroke-width="13" stroke-linecap="round" />
            <path class="bow__limbHi" d="M34 96 C 118 168, 168 240, 230 252 C 292 240, 342 168, 426 96" fill="none" stroke="url(#limbHi)" stroke-width="3" stroke-linecap="round" opacity=".7" />
            <path d="M34 96 C 22 82, 26 70, 40 66" fill="none" stroke="url(#limb)" stroke-width="8" stroke-linecap="round" />
            <path d="M426 96 C 438 82, 434 70, 420 66" fill="none" stroke="url(#limb)" stroke-width="8" stroke-linecap="round" />
            <rect x="216" y="206" width="28" height="70" rx="9" fill="url(#grip)" />
            <path d="M219 220h22 M219 236h22 M219 252h22" stroke="rgba(0,0,0,.35)" stroke-width="2" />
            <line class="bow__str" id="strL" x1="40" y1="70" x2="230" y2="96" stroke="#9a8068" stroke-width="2.2" stroke-linecap="round" />
            <line class="bow__str" id="strR" x1="420" y1="70" x2="230" y2="96" stroke="#9a8068" stroke-width="2.2" stroke-linecap="round" />
            <circle class="bow__serving" id="serving" cx="230" cy="96" r="4.5" fill="#6f5137" />
          </svg>

          <svg class="arrow" id="arrow" viewBox="0 0 64 220" aria-hidden="true">
            <defs>
              <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#4a2c14" />
                <stop offset=".5" stop-color="#8a5a2c" />
                <stop offset="1" stop-color="#3e2410" />
              </linearGradient>
              <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ffe38c" />
                <stop offset=".45" stop-color="#f4a626" />
                <stop offset="1" stop-color="#a85f0e" />
              </linearGradient>
              <linearGradient id="feath" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ff7f9c" />
                <stop offset=".5" stop-color="#e6396a" />
                <stop offset="1" stop-color="#a8154a" />
              </linearGradient>
              <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ffffff" />
                <stop offset="1" stop-color="#ffe0c4" />

            </defs>
            <rect x="29.4" y="30" width="5.2" height="168" rx="2.6" fill="url(#shaft)" />
            <g class="arrow__wings">
              <path class="wingL" d="M31 30 C 10 16, 2 20, 4 34 C 12 30, 20 32, 31 40 Z" fill="url(#wing)" stroke="rgba(196,132,58,.72)" stroke-width="1.2"/>
              <path class="wingR" d="M33 30 C 54 16, 62 20, 60 34 C 52 30, 44 32, 33 40 Z" fill="url(#wing)" stroke="rgba(196,132,58,.72)" stroke-width="1.2"/>

            <ellipse cx="27" cy="13" rx="2.6" ry="1.7" fill="#fff" opacity=".8" style="mix-blend-mode:screen" />
            <g class="arrow__fletch">

            <circle id="tip" cx="32" cy="9" r="0.6" fill="none" />

      <div class="blob blob--1"></div>
      <div class="blob blob--2"></div>
      <div class="blob blob--3"></div>

      <div class="fvignette"></div>

      <div class="camera" id="camera">
        <p class="kEyebrow" id="kEyebrow">make a wish&hellip;</p>

      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>

        <path d="M18.2 6a9 9 0 010 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity=".55" />
      </svg>
    </button>

    <p class="cinema__label" id="cinemaLabel">a little film, just for you</p>
  </section>

  <p class="sr-only">Happy Birthday. Here&rsquo;s to a wonderful year ahead.</p>

  <script>
    gsap.registerPlugin({
      name: 'drawn',
      init(target, value) {
        const len = target.getTotalLength();
        target.style.strokeDasharray = len;
        this.target = target; this.len = len; this.value = value;
      },
      render(ratio, data) {
        data.target.style.strokeDashoffset = data.len * (1 - data.value * ratio);
      },
    });

    const $ = (id) => document.getElementById(id);

    const canvas = $('tree');
    const ctx    = canvas.getContext('2d');
    const wishEl = $('wish');

    const hero       = $('hero');
    const eyebrow    = $('eyebrow');
    const hint       = $('hint');
    const motes      = $('motes');
    const target     = $('target');
    const targetHeart= $('targetHeart');
    const heartGlow  = target.querySelector('.heart__glow');
    const aim        = $('aim');

    const archery = $('archery');
    const bow     = $('bow');
    const arrow   = $('arrow');
    const strL    = $('strL');
    const strR    = $('strR');
    const serving = $('serving');

    const flood   = $('flood');
    const field   = $('field');
    const camera  = $('camera');
    const fgrid   = $('fgrid');

    const barTop  = $('barTop');
    const barBot  = $('barBot');
    const uline   = $('uline').querySelector('.uline__path');
    const bloom   = $('bloom');
    const replay  = $('replay');

    const continueBtn  = $('continueBtn');
    const gallery       = $('gallery');
    const galleryStage  = $('galleryStage');
    const galleryClose  = $('galleryClose');
    const galleryPrev   = $('galleryPrev');
    const galleryNext   = $('galleryNext');
    const galleryCaption= $('galleryCaption');
    const galleryDots   = $('galleryDots');
    const galleryToFilm = $('galleryToFilm');

    const cinema      = $('cinema');
    const cinemaVideo = $('cinemaVideo');
    const cinemaClose = $('cinemaClose');
    const cinemaPlay  = $('cinemaPlay');
    const cinemaMute  = $('cinemaMute');
    
    const bgMusic = $('bgMusic');
    const musicToggle = $('musicToggle');
    const icPlay = musicToggle.querySelector('.ic-play');
    const icPause = musicToggle.querySelector('.ic-pause');
    let wasMusicPlaying = false; 
    let userHasMuted = false; 

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const isRecord     = new URLSearchParams(location.search).has('record');

    if (isRecord) window.bdayCues = [];
    let recT0 = 0;
    function cue(name){ if (isRecord && recT0) window.bdayCues.push({ cue: name, t: (performance.now() - recT0) / 1000 }); }

    const rand  = (a, b) => a + Math.random() * (b - a);
    const pick  = (a)    => a[(Math.random() * a.length) | 0];
    const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
    const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
    const lerp  = (a, b, t) => a + (b - a) * t;
    const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
    const easeOutBack  = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

    function shade(hex, amt){
      const n = parseInt(hex.slice(1), 16);
      const r = clamp((n >> 16) + amt, 0, 255), g = clamp(((n >> 8) & 255) + amt, 0, 255), b = clamp((n & 255) + amt, 0, 255);
      return `rgb(${r | 0},${g | 0},${b | 0})`;
    }

    const BLOSSOM = [
      { c0: '#ffe1ec', c1: '#ff80aa' },
      { c0: '#ffd0e0', c1: '#f4577f' },
      { c0: '#ffc4d2', c1: '#e23b67' },
      { c0: '#ffd9c4', c1: '#ff8a5b' },
      { c0: '#ffeec2', c1: '#f6b13e' },
      { c0: '#ffd2e6', c1: '#e84d9a' },
    ];

    const T = {
      trunkStart: 0.10, branchSpan: 1.80, bloomT0: 1.25, bloomSpan: 2.00,
      petalT0: 2.45, noteStart: 0.45, done: 4.60,
    };

    const SS = 168;

    function heartShape(c, x, top, w, h){
      c.beginPath(); c.moveTo(x, top + h * 0.28);
      c.bezierCurveTo(x, top, x - w * 0.5, top, x - w * 0.5, top + h * 0.28);
      c.bezierCurveTo(x - w * 0.5, top + h * 0.60, x - w * 0.16, top + h * 0.80, x, top + h);
      c.bezierCurveTo(x + w * 0.16, top + h * 0.80, x + w * 0.5, top + h * 0.60, x + w * 0.5, top + h * 0.28);
      c.bezierCurveTo(x + w * 0.5, top, x, top, x, top + h * 0.28);
      c.closePath();
    }

    function makeBlossom({ c0, c1 }, soft){
      const cv = document.createElement('canvas'); cv.width = cv.height = SS;
      const c = cv.getContext('2d');
      const w = SS * 0.62, h = SS * 0.58, x = SS / 2, top = SS * 0.17;
      c.save();
      c.shadowColor = 'rgba(150,38,72,0.32)'; c.shadowBlur = SS * 0.085; c.shadowOffsetY = SS * 0.05;
      c.fillStyle = c1; heartShape(c, x, top, w, h); c.fill(); c.restore();
      const g = c.createRadialGradient(x - w * 0.20, top + h * 0.20, h * 0.04, x, top + h * 0.42, h * 0.92);
      g.addColorStop(0, c0); g.addColorStop(0.55, c1); g.addColorStop(1, shade(c1, -26));
      heartShape(c, x, top, w, h); c.fillStyle = g; c.fill();
      c.save(); heartShape(c, x, top, w, h); c.clip();
      const g2 = c.createLinearGradient(0, top, 0, top + h);
      g2.addColorStop(0, 'rgba(255,255,255,0)'); g2.addColorStop(0.65, 'rgba(110,16,46,0)'); g2.addColorStop(1, 'rgba(110,16,46,0.26)');
      c.fillStyle = g2; c.fillRect(0, 0, SS, SS);
      c.globalAlpha = 0.55; c.fillStyle = '#ffffff';
      c.beginPath(); c.ellipse(x - w * 0.15, top + h * 0.24, w * 0.17, h * 0.11, -0.5, 0, Math.PI * 2); c.fill();
      c.restore();
      if (!soft) return cv;
      const cv2 = document.createElement('canvas'); cv2.width = cv2.height = SS;
      const c2 = cv2.getContext('2d');
      c2.filter = 'blur(2.6px)'; c2.drawImage(cv, 0, 0); c2.filter = 'none';
      c2.globalCompositeOperation = 'source-atop';
      c2.globalAlpha = 0.42; c2.fillStyle = '#fff3ea'; c2.fillRect(0, 0, SS, SS);
      return cv2;
    }

    function makeBokeh(rgb){
      const S = 128, cv = document.createElement('canvas'); cv.width = cv.height = S;
      const c = cv.getContext('2d');
      const g = c.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
      g.addColorStop(0, `rgba(${rgb},0.9)`); g.addColorStop(0.45, `rgba(${rgb},0.22)`); g.addColorStop(1, `rgba(${rgb},0)`);
      c.fillStyle = g; c.fillRect(0, 0, S, S); return cv;
    }

    function makeSparkle(){
      const S = 64, cv = document.createElement('canvas'); cv.width = cv.height = S;
      const c = cv.getContext('2d'); const m = S / 2;
      const g = c.createRadialGradient(m, m, 0, m, m, m);
      g.addColorStop(0, 'rgba(255,255,255,0.95)'); g.addColorStop(0.25, 'rgba(255,236,200,0.5)'); g.addColorStop(1, 'rgba(255,236,200,0)');
      c.fillStyle = g; c.beginPath(); c.arc(m, m, m, 0, 6.2832); c.fill();
      c.fillStyle = 'rgba(255,255,255,0.95)'; c.translate(m, m);
      for (let k = 0; k < 2; k++){
        c.beginPath(); c.moveTo(0, -m); c.quadraticCurveTo(0, 0, m, 0); c.quadraticCurveTo(0, 0, 0, m); c.quadraticCurveTo(0, 0, -m, 0); c.quadraticCurveTo(0, 0, 0, -m);
        c.fill(); c.rotate(Math.PI / 4); c.scale(0.5, 0.5);
      }
      return cv;
    }

    let SPR = { crisp: [], soft: [] }, BOKEH = [], SPARKLE = null;
    function buildSprites(){
      SPR = { crisp: BLOSSOM.map((b) => makeBlossom(b, false)), soft: BLOSSOM.map((b) => makeBlossom(b, true)) };
      BOKEH = [makeBokeh('255,224,188'), makeBokeh('255,196,214'), makeBokeh('255,238,210')];
      SPARKLE = makeSparkle();
    }

    function drawSprite(sprite, x, y, size, rot, alpha){
      ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot); ctx.globalAlpha = alpha;
      ctx.drawImage(sprite, -size * 0.5, -size * 0.47, size, size); ctx.restore();
    }

    let heartPoly = null;
    function buildHeartPoly(){
      const raw = []; let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
      for (let i = 0; i <= 160; i++){
        const t = (i / 160) * Math.PI * 2;
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
        raw.push([x, y]);
        if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
      const midX = (minX + maxX) / 2, midY = (minY + maxY) / 2, hw = (maxX - minX) / 2, hh = (maxY - minY) / 2;
      heartPoly = raw.map(([x, y]) => [(x - midX) / hw, (y - midY) / hh]);
    }
    function pointInPoly(x, y){
      let inside = false; const p = heartPoly;
      for (let i = 0, j = p.length - 1; i < p.length; j = i++){
        const xi = p[i][0], yi = p[i][1], xj = p[j][0], yj = p[j][1];
        if (((yi > y) !== (yj > y)) && (x < ((xj - xi) * (y - yi)) / (yj - yi) + xi)) inside = !inside;
      }
      return inside;
    }

    let W = 0, H = 0, dpr = 1;
    let cx = 0, cy = 0, rx = 0, ry = 0, groundY = 0;
    let branches = [], hearts = [], petals = [], rested = [], orbs = [], floaters = [], twinkles = [];
    let bgGrad = null, glowGrad = null, groundGrad = null;

    const quad = (b, t) => { const m = 1 - t, a = m * m, k = 2 * m * t, d = t * t; return { x: a * b.x1 + k * b.cx + d * b.x2, y: a * b.y1 + k * b.cy + d * b.y2 }; };

    function barkGrad(x1, y1, x2, y2, depth){
      const g = ctx.createLinearGradient(x1, y1, x2, y2);
      g.addColorStop(0, `hsl(348 26% ${26 + depth * 3}%)`);
      g.addColorStop(1, `hsl(346 24% ${40 + depth * 5}%)`);
      return g;
    }

    function buildScene(){
      branches = []; hearts = []; petals = []; rested = []; twinkles = []; orbs = []; floaters = [];
      buildHeartPoly();

      const wide = W / H > 1.2;
      cx = W * (wide ? 0.57 : 0.5); cy = H * (wide ? 0.37 : 0.38);
      ry = Math.min(H * (wide ? 0.33 : 0.33), W * 0.34); rx = ry * 1.16; groundY = H * 0.93;

      bgGrad = ctx.createLinearGradient(0, 0, 0, H);
      bgGrad.addColorStop(0, '#fff3e9'); bgGrad.addColorStop(0.46, '#ffe7d6'); bgGrad.addColorStop(0.78, '#fcd9c4'); bgGrad.addColorStop(1, '#f3c4b5');
      glowGrad = ctx.createRadialGradient(cx, cy, ry * 0.1, cx, cy, ry * 1.55);
      glowGrad.addColorStop(0, 'rgba(255,219,170,0.6)'); glowGrad.addColorStop(0.5, 'rgba(255,170,150,0.2)'); glowGrad.addColorStop(1, 'rgba(255,170,150,0)');
      groundGrad = ctx.createRadialGradient(cx, H * 1.02, ry * 0.2, cx, H * 1.02, ry * 1.6);
      groundGrad.addColorStop(0, 'rgba(255,205,165,0.5)'); groundGrad.addColorStop(1, 'rgba(255,205,165,0)');

      for (let i = 0; i < 11; i++){
        orbs.push({ x: rand(0, W), y: rand(0, H), r: rand(W * 0.05, W * 0.17), vy: rand(-6, -16), drift: rand(-0.3, 0.3), phase: rand(0, 6.28), alpha: rand(0.05, 0.13), sprite: pick(BOKEH) });
      }

      const FN = wide ? 18 : 15;
      for (let i = 0; i < FN; i++){
        const depth = Math.random();
        floaters.push({
          x: rand(0, W), y: rand(-H * 0.1, H * 1.1), depth, idx: (Math.random() * BLOSSOM.length) | 0,
          box: lerp(Math.min(W, H) * 0.025, Math.min(W, H) * 0.075, depth), vy: lerp(7, 20, depth), sway: rand(8, 22), phase: rand(0, 6.28),
          rot: rand(-0.4, 0.4), vrot: rand(-0.5, 0.5), baseA: lerp(0.16, 0.5, depth), soft: depth < 0.45,
        });
      }

      const baseX = cx, baseY = H * 1.0;
      const trunkTopY = cy + ry * 0.62, trunkW = Math.max(9, W * 0.024), limbLen = ry * 0.6;
      const insidePx = (x, y, m = 0.9) => pointInPoly((x - cx) / (rx * m), (cy - y) / (ry * m));

      function addBranch(x, y, ang, len, w0, depth, t0){
        let ex = x + Math.cos(ang) * len, ey = y + Math.sin(ang) * len, clipped = false;
        if (!insidePx(ex, ey)){
          let lo = 0, hi = 1;
          for (let k = 0; k < 12; k++){ const mid = (lo + hi) / 2; (insidePx(x + Math.cos(ang) * len * mid, y + Math.sin(ang) * len * mid) ? lo = mid : hi = mid); }
          ex = x + Math.cos(ang) * len * lo; ey = y + Math.sin(ang) * len * lo; clipped = true;
        }
        const mx = (x + ex) / 2, my = (y + ey) / 2, perp = ang + Math.PI / 2, bend = rand(-1, 1) * len * 0.12, w1 = w0 * 0.66;
        branches.push({ x1: x, y1: y, cx: mx + Math.cos(perp) * bend, cy: my + Math.sin(perp) * bend, x2: ex, y2: ey, w0, w1, t0, dur: Math.max(0.14, 0.32 - depth * 0.03), depth, grad: barkGrad(x, y, ex, ey, depth) });
        return { ex, ey, w1, clipped };
      }
      function grow(x, y, ang, len, w, depth, t0){
        const r = addBranch(x, y, ang, len, w, depth, t0);
        if (r.clipped || depth >= 6 || len < ry * 0.06) return;
        const childT0 = t0 + (0.32 - depth * 0.03) * 0.6, n = Math.random() < 0.55 ? 2 : 3;
        for (let i = 0; i < n; i++){
          const spread = 0.6 * (i - (n - 1) / 2) + rand(-0.22, 0.22), lift = -0.06 + rand(-0.05, 0.05);
          grow(r.ex, r.ey, ang + spread + lift, len * rand(0.74, 0.84), r.w1, depth + 1, childT0 + i * 0.03);
        }
      }
      addBranch(baseX, baseY, -Math.PI / 2, baseY - trunkTopY, trunkW, 0, T.trunkStart);
      branches[0].dur = 0.55;
      const limbT0 = T.trunkStart + 0.36, L = 3;
      for (let i = 0; i < L; i++){
        const ang = -Math.PI / 2 + 0.62 * (i - (L - 1) / 2) + rand(-0.12, 0.12);
        grow(baseX, trunkTopY, ang, limbLen, trunkW * 0.7, 1, limbT0 + i * 0.05);
      }
      const maxT0 = branches.reduce((m, b) => Math.max(m, b.t0 + b.dur), 0);
      const sc = (T.branchSpan - T.trunkStart) / (maxT0 - T.trunkStart);
      for (const b of branches) b.t0 = T.trunkStart + (b.t0 - T.trunkStart) * sc;

      const COUNT = Math.round(clamp(rx * ry / 56, 250, 440));
      const baseBox = clamp(Math.min(W, H) * 0.115, 30, 74);
      let guard = 0;
      while (hearts.length < COUNT && guard < COUNT * 50){
        guard++; const u = rand(-1.06, 1.06), v = rand(-1.06, 1.06);
        if (!pointInPoly(u, v)) continue;
        const x = cx + u * rx, y = cy - v * ry, d = clamp01(Math.hypot(u, v + 1) / 2.4);
        const t0 = T.bloomT0 + d * (T.bloomSpan * 0.82) + rand(0, T.bloomSpan * 0.18);
        const soft = Math.random() < 0.42;
        hearts.push({ x, y, idx: (Math.random() * BLOSSOM.length) | 0, soft, box: baseBox * (soft ? rand(0.6, 0.85) : rand(0.78, 1.12)), rot: rand(-0.55, 0.55), sway: rand(0, 6.28), t0 });
      }
      hearts.sort((a, b) => (a.soft === b.soft ? a.y - b.y : a.soft ? -1 : 1));
    }

    function drawBackground(){
      ctx.globalAlpha = 1; ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 1; ctx.fillStyle = groundGrad; ctx.fillRect(0, 0, W, H); ctx.restore();
    }
    function drawGodRays(t, intensity){
      if (intensity <= 0) return;
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const ox = cx, oy = cy - ry * 0.35, R = Math.hypot(W, H) * 1.1;
      const rays = 9, sweep = Math.sin(t * 0.07) * 0.18;
      for (let i = 0; i < rays; i++){
        const a = -Math.PI / 2 + sweep + (i - (rays - 1) / 2) * 0.2, hw = 0.035 + 0.02 * (0.5 + 0.5 * Math.sin(t * 0.5 + i * 1.7));
        const a1 = a - hw, a2 = a + hw, g = ctx.createLinearGradient(ox, oy, ox + Math.cos(a) * R, oy + Math.sin(a) * R);
        g.addColorStop(0, `rgba(255,232,190,${0.10 * intensity})`); g.addColorStop(0.5, `rgba(255,214,170,${0.05 * intensity})`); g.addColorStop(1, 'rgba(255,214,170,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox + Math.cos(a1) * R, oy + Math.sin(a1) * R); ctx.lineTo(ox + Math.cos(a2) * R, oy + Math.sin(a2) * R); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }
    function drawGlow(t){
      const gi = clamp01((t - T.bloomT0) / (T.bloomSpan * 0.9)); if (gi <= 0) return;
      ctx.save(); ctx.globalAlpha = gi; ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = glowGrad; ctx.fillRect(0, 0, W, H); ctx.restore();
    }
    function drawBokeh(t, dt){
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (const o of orbs){
        o.y += o.vy * dt; o.x += Math.sin(t * 0.3 + o.phase) * o.drift;
        if (o.y < -o.r){ o.y = H + o.r; o.x = rand(0, W); }
        ctx.globalAlpha = o.alpha; ctx.drawImage(o.sprite, o.x - o.r, o.y - o.r, o.r * 2, o.r * 2);
      }
      ctx.restore();
    }
    function drawFloaters(t, dt, front){
      const appear = clamp01((t - 0.2) / 1.4); if (appear <= 0) return;
      for (const f of floaters){
        if ((f.depth >= 0.6) !== front) continue;
        f.y -= f.vy * dt; f.x += Math.sin(t * 0.5 + f.phase) * f.sway * dt; f.rot += f.vrot * dt;
        if (f.y < -f.box){ f.y = H + f.box; f.x = rand(0, W); }
        drawSprite((f.soft ? SPR.soft : SPR.crisp)[f.idx], f.x, f.y, f.box, f.rot, f.baseA * appear);
      }
    }
    function drawBranches(t){
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      for (const b of branches){
        const f = clamp01((t - b.t0) / b.dur); if (f <= 0) continue;
        const e = easeOutCubic(f); ctx.strokeStyle = b.grad;
        const steps = 12, last = Math.max(1, Math.ceil(steps * e));
        let prev = quad(b, 0);
        for (let i = 1; i <= last; i++){
          const tt = Math.min(e, i / steps), p = quad(b, tt);
          ctx.lineWidth = lerp(b.w0, b.w1, tt);
          ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(p.x, p.y); ctx.stroke(); prev = p;
        }
      }
    }
    function drawHearts(t){
      const breathe = 1 + Math.sin(t * 0.8) * 0.012;
      for (const h of hearts){
        const p = clamp01((t - h.t0) / 0.6); if (p <= 0) continue;
        const scale = Math.max(0, easeOutBack(p)); let alpha = clamp01(p * 1.7); if (h.soft) alpha *= 0.8;
        const settled = clamp01((t - h.t0 - 0.6) / 0.7), sway = settled * Math.sin(t * 1.5 + h.sway) * (h.box * 0.05);
        const rise = (1 - easeOutCubic(p)) * h.box * 0.45;
        const hx = cx + (h.x - cx) * breathe + sway, hy = cy + (h.y - cy) * breathe - rise;
        drawSprite((h.soft ? SPR.soft : SPR.crisp)[h.idx], hx, hy, h.box * scale, h.rot + sway * 0.012, alpha);
      }
    }
    function updateTwinkles(t, dt){
      const active = t > T.bloomT0 + T.bloomSpan * 0.45;
      if (active && twinkles.length < 9 && Math.random() < 0.5){
        const h = hearts[(Math.random() * hearts.length) | 0];
        if (h) twinkles.push({ x: h.x, y: h.y, size: rand(0.6, 1.3) * (Math.min(W, H) * 0.05), age: 0, life: rand(0.7, 1.2), rot: rand(0, 6.28) });
      }
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (let i = twinkles.length - 1; i >= 0; i--){
        const s = twinkles[i]; s.age += dt; const k = s.age / s.life;
        if (k >= 1){ twinkles.splice(i, 1); continue; }
        const a = Math.sin(k * Math.PI); drawSprite(SPARKLE, s.x, s.y, s.size * (0.6 + 0.4 * a), s.rot + k * 1.2, a);
      }
      ctx.restore();
    }
    function spawnPetal(){
      const h = hearts[(Math.random() * hearts.length) | 0]; if (!h) return;
      petals.push({ x: h.x + rand(-8, 8), y: h.y + rand(-8, 8), vy: rand(14, 30), vx: rand(-8, 8), sway: rand(0.6, 1.4), phase: rand(0, 6.28), box: h.box * rand(0.34, 0.6), idx: h.idx, rot: rand(0, 6.28), vrot: rand(-1.4, 1.4), age: 0, land: groundY + rand(-6, H * 0.05) });
    }
    function drawPetals(t, dt){
      for (let i = petals.length - 1; i >= 0; i--){
        const p = petals[i]; p.age += dt; p.vy += 8 * dt; p.x += (p.vx + Math.sin(t * p.sway + p.phase) * 16) * dt; p.y += p.vy * dt; p.rot += p.vrot * dt;
        if (p.y >= p.land){
          rested.push({ x: clamp(p.x, 6, W - 6), y: p.land, box: p.box, idx: p.idx, rot: p.rot, a: rand(0.7, 0.95) });
          if (rested.length > 90) rested.shift();
          petals.splice(i, 1); continue;
        }
        const a = p.age < 0.3 ? p.age / 0.3 : 1;
        drawSprite(SPR.crisp[p.idx], p.x, p.y, p.box, p.rot, a);
      }
    }
    function drawRested(){ for (const r of rested) drawSprite(SPR.crisp[r.idx], r.x, r.y, r.box, r.rot, r.a); }

    function showWish(on){ wishEl.classList.toggle('is-in', on); }

    let treeStartT = 0, treeLastT = 0, treeRAF = 0, lastPetal = 0, replayArmed = false;
    window.bdayDone = false;

    function treeFrame(now){
      if (!treeStartT){ treeStartT = now; treeLastT = now; }
      const t  = (now - treeStartT) / 1000;
      const dt = Math.min(0.05, (now - treeLastT) / 1000); treeLastT = now;

      musicToggle.style.opacity = '1';
      musicToggle.style.pointerEvents = 'auto';

      if (wasMusicPlaying && !userHasMuted) {
          bgMusic.play().then(updateMusicUI).catch(()=>{});
      }
    }

    function toggleCinemaPlay(){
      if (cinemaVideo.paused){ cinemaVideo.play().catch(() => {}); cinema.classList.add('is-playing'); cinemaMute.hidden = false; }
      else { cinemaVideo.pause(); cinema.classList.remove('is-playing'); }
    }
    function toggleCinemaMute(){
      cinemaVideo.muted = !cinemaVideo.muted; cinemaMute.querySelector('.ic-off').hidden = !cinemaVideo.muted; cinemaMute.querySelector('.ic-on').hidden = cinemaVideo.muted;
      cinemaMute.setAttribute('aria-label', cinemaVideo.muted ? 'Turn sound on' : 'Mute');
    }

    cinemaClose.addEventListener('click', closeCinema); cinemaPlay.addEventListener('click', toggleCinemaPlay);
    cinemaVideo.addEventListener('click', toggleCinemaPlay); cinemaMute.addEventListener('click', (e) => { e.stopPropagation(); toggleCinemaMute(); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape'){ if (cinema.classList.contains('is-open')) closeCinema(); else if (gallery.classList.contains('is-open')) closeGallery(); }
      if (gallery.classList.contains('is-open')){ if (e.key === 'ArrowRight') showSlide(gIndex + 1, true); if (e.key === 'ArrowLeft') showSlide(gIndex - 1, true); }
    });
    document.addEventListener('visibilitychange', () => { if (document.hidden) stopAutoplay(); else restartAutoplay(); });

    function updateMusicUI() {
      if (bgMusic.paused) {
        icPlay.hidden = true;
        icPause.hidden = false;
      } else {
        icPlay.hidden = false;
        icPause.hidden = true;
      }
    }

    function toggleMusic() {
      if (bgMusic.paused) {
        userHasMuted = false;
        bgMusic.play().then(updateMusicUI).catch(e => console.log("Audio play blocked", e));
      } else {
        userHasMuted = true;
        bgMusic.pause();
        updateMusicUI();
      }
    }
    musicToggle.addEventListener('click', toggleMusic);

    document.body.addEventListener('pointerdown', () => {
      if (bgMusic.paused && !userHasMuted && !cinema.classList.contains('is-open')) {
        bgMusic.play().then(updateMusicUI).catch(() => {});
      }
    }, { once: true });
    
    bgMusic.play().then(updateMusicUI).catch(updateMusicUI);

    function resize(){
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = canvas.clientWidth; H = canvas.clientHeight;
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      buildSprites(); buildScene();
      if (reduceMotion){ drawFinal(); return; }
      if (played && filmTL){
        const at = filmTL.time(), active = filmTL.isActive(); filmTL = buildFilm(shotGeom()); filmTL.pause(at); if (active) filmTL.play(at);
      } else { refreshRig(); setDraw(0); }
    }
    let resizeRAF = 0; window.addEventListener('resize', () => { if (resizeRAF) return; resizeRAF = requestAnimationFrame(() => { resizeRAF = 0; resize(); }); });
    // Mobile browsers change the visual viewport (address bar show/hide) without firing a
    // regular resize — listen here too so the tree canvas + heights stay correctly sized.
    if (window.visualViewport){
      window.visualViewport.addEventListener('resize', () => { if (resizeRAF) return; resizeRAF = requestAnimationFrame(() => { resizeRAF = 0; resize(); }); });
    }
    window.addEventListener('orientationchange', () => { setTimeout(resize, 150); });
    
    resize();

    if (reduceMotion){ drawFinal(); } else {
      buildMotes(); document.fonts && document.fonts.ready.then(() => { refreshRig(); setDraw(0); });
      enter(); replay.addEventListener('click', resetAll);
    }
  </script>
</body>
</html>
